    pov: A
    ending_type: closed
    category: retreat
    title: 普通的雨
    summary: A 忽略信号并返回住处，异常事件暂时没有展开。
    effects:
      - type: ending.unlock
        target: endings.ch00_a_closed_home

  - id: ch00_a_canon_signal
