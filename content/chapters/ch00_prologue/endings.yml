    summary: A 确认异常真实存在，并进入废弃旧楼。
    canon_state:
      world.flags.ch00_finished: true
      world.flags.a_knows_anomaly_exists: true
      clues.core_signal: true
    effects:
      - type: ending.unlock
        target: endings.ch00_a_canon_signal
