nodes:
  - id: ch01_a_001
    chapter: ch01
    pov: A
    node_kind: story
    title: 昏暗走廊
    body: 走廊灯忽明忽暗，闪烁的节奏和手机里的异常信号完全一致。
    effects:
      - type: world.set
        target: world.flags.ch01_started
        value: true
      - type: world.set
        target: world.scene.current_area
        value: corridor
    choices:
      - id: inspect_lock
        text: 检查旧锁
        requirements:
          all:
            - var: attributes.A.insight
              op: ">="
              value: 2
        effects:
          - type: clue.add
            target: clues.old_lock_mark
            value: true
        next: ch01_a_002
      - id: push_ahead
        text: 不检查，直接向前
        effects:
          - type: attribute.add
            target: attributes.A.stamina
            value: -1
        next: ch01_a_router_final

  - id: ch01_a_002
    chapter: ch01
    pov: A
    node_kind: story
    title: 锁上的刻痕
    body: 旧锁上的一道刻痕，正好对应手机里那段破碎波形的缺口。
    effects:
      - type: attribute.add
        target: attributes.A.pollution
        value: 5
    next: ch01_a_router_final

  - id: ch01_a_router_final
    chapter: ch01
    pov: A
    node_kind: router
    title: 路线判定
    routes:
      - conditions:
          all:
            - var: clues.old_lock_mark
              op: "=="
              value: true
        next: ch01_a_canon_trace_node
      - conditions:
          all: []
        next: ch01_a_closed_lost_node

  - id: ch01_a_closed_lost_node
    chapter: ch01
    pov: A
    node_kind: ending
    title: 封闭结局 - 信号丢失
    body: A 跟丢了信号，只带着越来越重的头痛离开旧楼。
    ending:
      id: ch01_a_closed_lost

  - id: ch01_a_canon_trace_node
    chapter: ch01
    pov: A
    node_kind: ending
    title: 正史结局 - 信号轨迹
    body: A 找到了异常第一次稳定重复的痕迹。
    ending:
      id: ch01_a_canon_trace
